    <!-- Content Loading Script
    ================================================== -->
    <script>
        // Load content when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            loadContent();
        });

        // Update content on window resize for responsive values
        window.addEventListener('resize', function() {
            // Only update intro values on resize with span animation
            const isMobile = window.innerWidth <= 1200;
            const valuesContent = isMobile ? getContent('intro.valuesMobile') : getContent('intro.values');
            animateIntroSpans(valuesContent);
        });

        function loadContent() {
            // Navigation
            updateElement('[data-content="nav.whoAmI"]', getContent('nav.whoAmI'));
            updateElement('[data-content="nav.whatIDo"]', getContent('nav.whatIDo'));
            updateElement('[data-content="nav.getInTouch"]', getContent('nav.getInTouch'));

            // Intro Section with span animation
            updateElement('[data-content="intro.title"]', getContent('intro.title'));
            updateElement('[data-content="intro.subtitle"]', getContent('intro.subtitle'));
            
            // Load mobile or desktop values based on screen size with span animation
            const isMobile = window.innerWidth <= 1200;
            const valuesContent = isMobile ? getContent('intro.valuesMobile') : getContent('intro.values');
            animateIntroSpans(valuesContent);

            // Why Section
            updateElement('[data-content="whySection.pretitle"]', getContent('whySection.pretitle'));
            updateElement('[data-content="whySection.title"]', getContent('whySection.title'));
            updateElement('[data-content="whySection.subtitle"]', getContent('whySection.subtitle'));

            // About Section
            updateElement('[data-content="aboutSection.pretitle"]', getContent('aboutSection.pretitle'));
            updateElement('[data-content="aboutSection.title"]', getContent('aboutSection.title'));
            updateElement('[data-content="aboutSection.description"]', getContent('aboutSection.description'));
            updateElement('[data-content="aboutSection.additionalDescription"]', getContent('aboutSection.additionalDescription'));

            // Services Section
            updateElement('[data-content="servicesSection.pretitle"]', getContent('servicesSection.pretitle'));
            updateElement('[data-content="servicesSection.title"]', getContent('servicesSection.title'));
            updateElement('[data-content="servicesSection.description"]', getContent('servicesSection.description'));

            // Load services dynamically
            const services = getContent('servicesSection.services');
            services.forEach((service, index) => {
                updateElement(`[data-content="service.${index}.title"]`, service.title);
                updateElement(`[data-content="service.${index}.subtitle"]`, service.subtitle);
                updateElement(`[data-content="service.${index}.description"]`, service.description);
            });

            // Work With sections
            updateElement('[data-content="workWith.appsAndBrands.title"]', getContent('workWith.appsAndBrands.title'));
            updateElement('[data-content="workWith.appsAndBrands.description"]', getContent('workWith.appsAndBrands.description'));
            updateElement('[data-content="workWith.appsAndBrands.result"]', getContent('workWith.appsAndBrands.result'));
            updateElement('[data-content="workWith.mediaPartners.title"]', getContent('workWith.mediaPartners.title'));
            updateElement('[data-content="workWith.mediaPartners.description"]', getContent('workWith.mediaPartners.description'));
            updateElement('[data-content="workWith.mediaPartners.result"]', getContent('workWith.mediaPartners.result'));

            // Footer
            updateElement('[data-content="footer.pretitle"]', getContent('footer.pretitle'));
            updateElement('[data-content="footer.title"]', getContent('footer.title'));
            updateElement('[data-content="footer.description"]', getContent('footer.description'));
            updateElement('[data-content="footer.copyright"]', getContent('footer.copyright'));

            // Update LinkedIn URL
            const linkedinLink = document.querySelector('[data-content="footer.linkedinUrl"]');
            if (linkedinLink) {
                linkedinLink.href = getContent('footer.linkedinUrl');
            }
        }

        function updateElement(selector, content) {
            const element = document.querySelector(selector);
            if (element && content) {
                element.innerHTML = content;
            }
        }

        function animateIntroSpans(content) {
            const element = document.querySelector('[data-content="intro.values"]');
            if (!element || !content) return;

            // Set the content first
            element.innerHTML = content;

            // Find all spans and apply staggered animation delays
            const spans = element.querySelectorAll('span');
            spans.forEach((span, index) => {
                span.style.animationDelay = `${index * 0.3}s`;
            });
        }
    </script>
